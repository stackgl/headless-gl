name: Prebuild, Create Release, Publish
run-name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Dry run ({0})', github.ref_name) }}

# Only a pushed version tag uploads prebuilds and publishes to npm.
# Every other trigger is a dry run: it builds the same prebuilds but keeps them as workflow artifacts.
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'binding.gyp'
      - 'deps/**'
      - 'src/native/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'binding.gyp'
      - 'deps/**'
      - 'src/native/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  # A release runs the tests first and builds nothing if they fail.
  # Dry runs skip them, since pushes and pull requests already run ci.yml on their own.
  test:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  build:
    needs:
      - test
    # Without this, a skipped test job would skip the builds too.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        node-version: [26.x]
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
        target: ["22.0.0", "24.0.0", "26.0.0"]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: write
      attestations: write
      packages: read
    env:
      UPLOAD_TOKEN: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.GITHUB_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prebuild
        if: runner.os != 'Linux'
        shell: bash
        run: node "./node_modules/prebuild/bin.js" -t ${{ matrix.target }} --include-regex "\.(node|dylib|dll|so)$" ${UPLOAD_TOKEN:+-u "$UPLOAD_TOKEN"} --verbose
      - name: Prebuild (macOS x64)
        if: runner.os == 'macOS'
        shell: bash
        run: node "./node_modules/prebuild/bin.js" -t ${{ matrix.target }} --arch x64 --include-regex "\.(node|dylib|dll|so)$" ${UPLOAD_TOKEN:+-u "$UPLOAD_TOKEN"} --verbose
      - name: Prebuild (glibc)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          docker run --rm -v "$PWD:/src" -w "/src" node:26-bookworm
          node "./node_modules/prebuild/bin.js" -t ${{ matrix.target }} --strip --include-regex "\.(node|dylib|dll|so)$" ${UPLOAD_TOKEN:+-u "$UPLOAD_TOKEN"} --verbose
      - name: Prebuild (musl)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          docker run --rm -e UPLOAD_TOKEN -v "$PWD:/src" -w "/src" alpine:3.22 sh -c
          'apk add --no-cache build-base python3 nodejs &&
          node "./node_modules/prebuild/bin.js" -t ${{ matrix.target }} --strip --include-regex "\.(node|dylib|dll|so)$" ${UPLOAD_TOKEN:+-u "$UPLOAD_TOKEN"} --verbose'
      - name: Attest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'prebuilds/*.tar.gz'
      - name: Keep dry-run prebuilds
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}-node-${{ matrix.target }}
          path: 'prebuilds/*.tar.gz'
          if-no-files-found: error
          retention-days: 7

  # Source builds of the published package download the ANGLE libraries from this release.
  angle:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/angle-release.yml
    permissions:
      contents: write

  publish:
    name: Publish to NPM
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - angle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'
      - id: release_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            echo "TAG=next" >> "$GITHUB_ENV"
          else
            echo "TAG=latest" >> "$GITHUB_ENV"
          fi
      - name: Stage NPM publish
        run: npm stage publish --tag "$TAG" --provenance --access public
