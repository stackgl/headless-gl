name: Prebuild, Create Release, Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        node-version: [26.x]
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
        target: ["22.0.0", "24.0.0", "26.0.0"]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: write
      attestations: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prebuild and Publish
        if: runner.os != 'Linux'
        shell: bash
        run: node ./node_modules/prebuild/bin.js -t ${{ matrix.target }} --include-regex "\.(node|dylib|dll|so)$" -u ${{ secrets.GITHUB_TOKEN }} --verbose
      - name: Prebuild and Publish (macOS x64)
        if: runner.os == 'macOS'
        shell: bash
        run: node ./node_modules/prebuild/bin.js -t ${{ matrix.target }} --arch x64 --include-regex "\.(node|dylib|dll|so)$" -u ${{ secrets.GITHUB_TOKEN }} --verbose
      - name: Prebuild and Publish (glibc)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          docker run --rm -v "$PWD:/src" -w /src node:26-bookworm
          node ./node_modules/prebuild/bin.js -t ${{ matrix.target }} --strip --include-regex "\.(node|dylib|dll|so)$" -u ${{ secrets.GITHUB_TOKEN }} --verbose
      - name: Prebuild and Publish (musl)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -c
          'apk add --no-cache build-base python3 nodejs &&
          node ./node_modules/prebuild/bin.js -t ${{ matrix.target }} --strip --include-regex "\.(node|dylib|dll|so)$" -u ${{ secrets.GITHUB_TOKEN }} --verbose'
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'prebuilds/*.tar.gz'

  publish:
    name: Publish to NPM
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'
      - id: release_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            echo "TAG=next" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi
      - name: Stage NPM publish
        run: npm stage publish --tag "$TAG" --provenance --access public
